name: BantuDulu Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      ENABLE_DEV_SEED: "false"
      SECRET_KEY: phase-12-ci-secret-key-that-is-long-enough-2026
      DATABASE_URL: sqlite+aiosqlite:///./.pytest-bantudulu.db
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync locked runtime dependencies
        run: uv sync --frozen --no-install-project

      - name: Install test dependencies
        run: uv pip install --python .venv/bin/python pytest pytest-asyncio

      - name: Dependency consistency
        run: uv pip check --python .venv/bin/python

      - name: Compile validation
        run: .venv/bin/python -m compileall -q app scripts tests

      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite+aiosqlite:///./.migration-smoke.db
        run: |
          .venv/bin/python -m scripts.migrate
          rm -f .migration-smoke.db

      - name: Test suite
        run: .venv/bin/python -m pytest -q
