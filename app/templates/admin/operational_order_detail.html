<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BantuDulu — Detail Pesanan Admin</title>
<link rel="icon" type="image/svg+xml" href="/static/bd-favicon.svg">
<style>
:root{--brand:#28758b;--deep:#194f60;--ink:#111827;--muted:#6b7280;--line:#e3eaed;--bg:#f4f7f8;--soft:#edf5f7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:820px;margin:auto;padding:20px}.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:20px}.head h1{margin:0;font-size:20px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#f4fafb,#edf5f7)}.hero small{font-size:9px;color:var(--muted)}.hero h2{margin:5px 0 3px;font-size:19px}.hero p{margin:0;font-size:10px;color:#5d6d75}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card h3{font-size:12px;margin:0 0 10px;color:var(--deep)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f0f3f4}.row:last-child{border-bottom:0}.row span{font-size:9.5px;color:var(--muted)}.row b{font-size:10px;text-align:right;max-width:62%;word-break:break-word}.notice{font-size:10px;line-height:1.5;color:#56656d;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.btn{display:inline-flex;margin-top:12px;height:42px;padding:0 14px;border-radius:12px;align-items:center;background:var(--brand);color:#fff;font-size:10px;font-weight:800}
@media(max-width:650px){.wrap{padding:14px 12px}.grid{grid-template-columns:1fr}.row b{max-width:58%}}
</style>
</head>
<body>
<main class="wrap">
<div class="head"><a class="back" href="/admin/pesanan">‹</a><h1>Detail Pesanan</h1></div>
<div id="root"><div class="notice">Memuat detail...</div></div>
</main>
<script>
const orderId={{ order_id|tojson }};
const labels={menunggu:'Pesanan Baru',diproses:'Diproses Admin',ditugaskan:'Mitra Ditugaskan',menuju_lokasi:'Menuju Lokasi',dimulai:'Pekerjaan Berjalan',menunggu_konfirmasi:'Menunggu Konfirmasi Admin',selesai:'Selesai',dibatalkan:'Dibatalkan'};
const rupiah=v=>'Rp '+Number(v||0).toLocaleString('id-ID');
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}
function add(card,label,value){const r=el('div','row');r.append(el('span','',label),el('b','',value||'-'));card.append(r)}
function render(o){
 const root=document.getElementById('root');root.replaceChildren();
 const hero=el('section','hero');hero.append(el('small','','Kode Pesanan'),el('h2','',o.kode),el('p','',labels[o.status]||o.status));root.append(hero);
 const grid=el('div','grid'),a=el('section','card'),b=el('section','card');a.append(el('h3','','Pesanan'));add(a,'Layanan',o.layanan_nama);add(a,'Varian',o.varian_nama);add(a,'Jadwal',`${o.jadwal||'-'} ${o.jam||''}`);add(a,'Durasi',String(o.durasi||1));add(a,'Total',rupiah(o.total_harga));add(a,'Pembayaran',`${(o.metode_pembayaran||'cod').toUpperCase()} · ${o.status_pembayaran||'-'}`);
 b.append(el('h3','','Pelanggan & Penugasan'));add(b,'Pelanggan',o.pelanggan_nama);add(b,'WhatsApp',o.pelanggan_wa);add(b,'Alamat',o.alamat);add(b,'Mitra',o.mitra?o.mitra.nama:'Belum ditugaskan');add(b,'Status Mitra',o.mitra?o.mitra.assignment_status:'-');grid.append(a,b);root.append(grid);
 const note=el('div','notice','Perubahan status bebas dinonaktifkan. Gunakan panel Operasional Pesanan agar alur penugasan, pembayaran COD, dan penyelesaian Admin tetap aman.');root.append(note);
 const back=el('a','btn','Kembali ke Operasional Pesanan');back.href='/admin/pesanan';root.append(back);
}
async function load(){const r=await fetch('/api/ops/admin/orders/'+encodeURIComponent(orderId),{cache:'no-store',credentials:'same-origin'});if(r.status===401||r.status===403){location.href='/masuk';return}if(!r.ok){root.textContent='Pesanan tidak ditemukan.';return}render(await r.json())}
load();
</script>
</body>
</html>
