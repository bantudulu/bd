<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Notifikasi · BantuDulu</title><meta name="theme-color" content="#042544"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;font-family:'Plus Jakarta Sans',sans-serif;color:#111827;padding-bottom:86px}.app{max-width:480px;margin:auto;min-height:100vh}.head{position:sticky;top:0;z-index:5;background:rgba(244,247,246,.96);backdrop-filter:blur(12px);padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center}.head h1{font-size:21px;margin:0}.head button{border:0;background:none;color:#0a5098;font:inherit;font-size:12px;font-weight:800;padding:8px;cursor:pointer}.list{padding:4px 20px 24px}.item{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #eef0f2;border-radius:16px;padding:14px 15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.item.unread{border-color:#c8deef;background:#f9fcff}.top{display:flex;align-items:flex-start;gap:10px}.ico{width:36px;height:36px;border-radius:11px;background:#eef4f8;display:grid;place-items:center;flex:none}.copy{flex:1}.title{font-size:13px;font-weight:800;color:#042544}.msg{font-size:12px;color:#64748b;line-height:1.5;margin-top:4px}.time{font-size:10px;color:#9ca3af;margin-top:7px}.dot{width:8px;height:8px;border-radius:50%;background:#EAAE24;flex:none;margin-top:5px}.state{text-align:center;padding:64px 24px;background:#fff;border-radius:18px;color:#64748b}.state .emoji{font-size:38px}.state h2{font-size:16px;color:#334155;margin:8px 0 4px}.state p{font-size:12px;line-height:1.5;margin:0 0 14px}.retry{border:0;border-radius:12px;background:#042544;color:#fff;padding:10px 16px;font:inherit;font-size:12px;font-weight:800}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom);z-index:20}.nav-inner{height:68px;max-width:480px;margin:auto;display:flex}.nav a{flex:1;text-decoration:none;color:#9ca3af;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600}.nav a.active{color:#EAAE24}.nav svg{width:22px;height:22px;fill:currentColor}@media(max-width:360px){.list,.head{padding-left:14px;padding-right:14px}}
</style></head><body><div class="app"><header class="head"><h1>Notifikasi</h1><button id="readAll" onclick="markAll()">Tandai semua dibaca</button></header><main class="list" id="list"><div class="state"><div class="emoji">🔔</div><h2>Memuat notifikasi</h2><p>Sebentar ya, kami sedang mengambil informasi terbaru.</p></div></main></div><nav class="nav"><div class="nav-inner"><a href="/beranda"><svg viewBox="0 0 24 24"><path d="M12 3 4 9v12h5v-7h6v7h5V9z"/></svg><span>Beranda</span></a><a href="/cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Cari</span></a><a href="/pesanan"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h8M8 17h5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Pesanan</span></a><a class="active" href="/notifikasi"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>Notifikasi</span></a><a href="/profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Akun</span></a></div></nav><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const icon=t=>{t=(t||'').toLowerCase();if(t.includes('petugas'))return'👤';if(t.includes('lokasi'))return'📍';if(t.includes('selesai'))return'✓';if(t.includes('batal'))return'!';return'🔔'};function fmt(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}async function load(){const box=document.getElementById('list');try{const r=await fetch('/api/notifikasi');const d=await r.json();if(!r.ok)throw new Error(d.detail||'Gagal memuat');const rows=d.data||[];document.getElementById('readAll').style.visibility=rows.some(n=>!n.dibaca)?'visible':'hidden';if(!rows.length){box.innerHTML='<div class="state"><div class="emoji">🔕</div><h2>Belum ada notifikasi</h2><p>Informasi tentang petugas dan perkembangan pesanan akan muncul di sini.</p></div>';return}box.innerHTML=rows.map(n=>`<a class="item ${n.dibaca?'':'unread'}" href="${esc(n.action_url||'/notifikasi')}" onclick="readOne('${n.id}')"><div class="top"><div class="ico">${icon(n.judul)}</div><div class="copy"><div class="title">${esc(n.judul)}</div><div class="msg">${esc(n.pesan)}</div><div class="time">${esc(fmt(n.created_at))}</div></div>${n.dibaca?'':'<span class="dot"></span>'}</div></a>`).join('')}catch(e){box.innerHTML='<div class="state"><div class="emoji">😕</div><h2>Notifikasi belum bisa dimuat</h2><p>Periksa koneksi lalu coba lagi.</p><button class="retry" onclick="load()">Coba Lagi</button></div>'}}async function readOne(id){try{await fetch('/api/notifikasi/'+id+'/read',{method:'PUT'})}catch(e){}}async function markAll(){try{await fetch('/api/notifikasi/read-all',{method:'PUT'});await load()}catch(e){}}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js',{scope:'/'});
</script></body></html>
