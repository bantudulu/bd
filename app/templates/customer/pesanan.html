<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Pesanan · BantuDulu</title>
  <meta name="theme-color" content="#042544" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7f6;font-family:'Plus Jakarta Sans',sans-serif;color:#111827;padding-bottom:86px}.app{max-width:480px;margin:auto;min-height:100vh}.hero{background:linear-gradient(135deg,#042544,#0a5098);color:#fff;padding:22px 20px 26px;border-radius:0 0 26px 26px}.hero h1{font-size:23px;margin:0 0 4px}.hero p{font-size:12px;opacity:.8;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:10px;opacity:.8}.tabs{display:flex;gap:7px;overflow:auto;padding:16px 20px 4px}.tab{border:0;border-radius:999px;background:#e8edf0;color:#64748b;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:700;white-space:nowrap}.tab.active{background:#042544;color:#fff}.list{padding:12px 20px 24px}.card{display:block;background:#fff;border-radius:17px;padding:15px;margin-bottom:11px;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #f1f2f4}.top{display:flex;align-items:flex-start;gap:11px}.icon{width:43px;height:43px;border-radius:13px;background:#eef3f6;display:grid;place-items:center;font-size:20px;flex:none}.info{flex:1;min-width:0}.name{font-weight:800;font-size:14px;line-height:1.25}.variant{font-size:11px;color:#8b93a1;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;white-space:nowrap}.status.menunggu{background:#fff7d6;color:#92400e}.status.ditugaskan{background:#e0f2fe;color:#075985}.status.menuju_lokasi{background:#ede9fe;color:#6d28d9}.status.dimulai{background:#dcfce7;color:#166534}.status.selesai{background:#ecfdf5;color:#047857}.status.dibatalkan{background:#fef2f2;color:#b91c1c}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid #f1f2f4;font-size:11px;color:#6b7280}.price{font-size:13px;font-weight:800;color:#EAAE24}.empty{text-align:center;padding:60px 20px;background:#fff;border-radius:18px}.empty .emoji{font-size:42px}.empty h2{font-size:17px;margin:9px 0 5px}.empty p{font-size:12px;color:#6b7280;line-height:1.5}.empty a{display:inline-flex;margin-top:14px;background:#042544;color:#fff;text-decoration:none;border-radius:13px;padding:11px 18px;font-size:13px;font-weight:700}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding-bottom:env(safe-area-inset-bottom);z-index:20}.nav-inner{height:68px;max-width:480px;margin:auto;display:flex}.nav a{position:relative;flex:1;text-decoration:none;color:#9ca3af;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600}.nav a.active{color:#EAAE24}.nav svg{width:22px;height:22px;fill:currentColor}.nav-badge{position:absolute;top:7px;left:calc(50% + 6px);background:#ef4444;color:#fff;min-width:16px;height:16px;border-radius:8px;padding:0 4px;font-size:9px;display:none;align-items:center;justify-content:center}@media(max-width:360px){.list,.tabs{padding-left:14px;padding-right:14px}.hero{padding-left:14px;padding-right:14px}.status{max-width:100px;overflow:hidden;text-overflow:ellipsis}}
  </style>
</head>
<body>
<div class="app">
  <header class="hero"><h1>Pesanan Saya</h1><p>Pantau semua layanan BantuDulu dari satu tempat.</p><div class="stats"><div class="stat"><b id="sTotal">0</b><span>Total</span></div><div class="stat"><b id="sActive">0</b><span>Aktif</span></div><div class="stat"><b id="sDone">0</b><span>Selesai</span></div></div></header>
  <div class="tabs" id="tabs"><button class="tab active" data-filter="semua">Semua</button><button class="tab" data-filter="aktif">Aktif</button><button class="tab" data-filter="selesai">Selesai</button><button class="tab" data-filter="dibatalkan">Dibatalkan</button></div>
  <main class="list" id="list"></main>
  <script id="ordersData" type="application/json">{{ orders_json | safe }}</script>
</div>
<nav class="nav"><div class="nav-inner">
<a href="/beranda"><svg viewBox="0 0 24 24"><path d="M12 3 4 9v12h5v-7h6v7h5V9z"/></svg><span>Beranda</span></a>
<a href="/cari"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Cari</span></a>
<a class="active" href="/pesanan"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 12h8M8 17h5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Pesanan</span></a>
<a href="/notifikasi"><span id="notifBadge" class="nav-badge"></span><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span>Notifikasi</span></a>
<a href="/profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Akun</span></a>
</div></nav>
<script>
(function(){
  let orders=[];try{orders=JSON.parse(document.getElementById('ordersData').textContent||'[]')}catch(e){orders=[]}
  const labels={menunggu:'Menunggu Petugas',diproses:'Menunggu Petugas',ditugaskan:'Petugas Ditugaskan',menuju_lokasi:'Menuju Lokasi',dimulai:'Sedang Dikerjakan',selesai:'Selesai',dibatalkan:'Dibatalkan'};
  const active=new Set(['menunggu','diproses','ditugaskan','menuju_lokasi','dimulai']);
  const iconFor=s=>{s=(s||'').toLowerCase();if(s.includes('bersih'))return'🧹';if(s.includes('ac')||s.includes('elektronik'))return'🔧';if(s.includes('les'))return'📚';if(s.includes('pijat'))return'💆';if(s.includes('salon')||s.includes('mua'))return'💇';if(s.includes('belanja')||s.includes('helper'))return'🛒';return'📋'};
  const fmtDate=v=>{if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
  const fmtPrice=v=>'Rp'+Number(v||0).toLocaleString('id-ID');
  let filter='semua';
  function subset(){return orders.filter(o=>{const s=(o.status||'menunggu').toLowerCase();if(filter==='aktif')return active.has(s);if(filter==='selesai')return s==='selesai';if(filter==='dibatalkan')return s==='dibatalkan';return true})}
  function render(){document.getElementById('sTotal').textContent=orders.length;document.getElementById('sActive').textContent=orders.filter(o=>active.has((o.status||'').toLowerCase())).length;document.getElementById('sDone').textContent=orders.filter(o=>(o.status||'').toLowerCase()==='selesai').length;const list=document.getElementById('list');const rows=subset();if(!rows.length){list.innerHTML='<div class="empty"><div class="emoji">📋</div><h2>Tidak ada pesanan</h2><p>'+ (orders.length?'Belum ada pesanan pada status ini.':'Pesan layanan yang kamu butuhkan, lalu BantuDulu akan menyiapkan petugasnya.') +'</p><a href="/beranda">Cari Layanan</a></div>';return}list.innerHTML=rows.map(o=>{const s=(o.status||'menunggu').toLowerCase();return `<a class="card" href="/pesanan/${encodeURIComponent(o.kode||o.id)}"><div class="top"><div class="icon">${iconFor(o.kategori_nama||o.layanan_nama)}</div><div class="info"><div class="name">${escapeHtml(o.layanan_nama||'Pesanan')}</div><div class="variant">${escapeHtml(o.varian_nama||o.kode||'')}</div></div><span class="status ${s}">${escapeHtml(labels[s]||s)}</span></div><div class="bottom"><span>📅 ${escapeHtml(fmtDate(o.tanggal||o.created_at))}</span><span class="price">${fmtPrice(o.total_harga)}</span></div></a>`}).join('')}
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});render();
  fetch('/api/notifikasi/unread-count').then(r=>r.ok?r.json():null).then(d=>{if(d&&d.unread_count){const b=document.getElementById('notifBadge');b.textContent=d.unread_count>9?'9+':d.unread_count;b.style.display='flex'}}).catch(()=>{});
  if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js',{scope:'/'});
})();
</script>
</body></html>
