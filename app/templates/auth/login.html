<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masuk · BantuDulu</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/images/pwa/apple-touch-icon.png" />
  <meta name="theme-color" content="#042544" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BantuDulu" />
  <meta name="description" content="Layanan jasa on-demand langsung ke rumah Anda. Bersih rumah, cuci AC, les privat, pijat, salon, bantu belanja." />
  <meta name="application-name" content="BantuDulu" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- ── Fonts: non-render-blocking (swap) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" /></noscript>
  <!-- ── Non-critical CSS: async load ── -->
  <link rel="preload" as="style" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/style.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/static/css/style.css" /></noscript>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(13, 148, 136, 0.10);
      overflow: hidden;
    }
    .auth-hero {
      background: linear-gradient(135deg, rgba(4,37,68,0.68) 0%, rgba(6,58,110,0.62) 50%, rgba(10,80,152,0.58) 100%),
                  url('/static/images/bg-hero.png') center / cover no-repeat;
      padding: 32px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-hero-logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 16px rgba(0,0,0,0.20);
      display: block;
      margin: 0 auto 16px;
    }
    .auth-hero-domain {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .auth-hero-tagline {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      padding: 0 10px;
    }
    .auth-body {
      padding: 24px 24px 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #9ca3af;
      font-size: 18px;
      pointer-events: none;
      line-height: 1;
    }
    .input-field {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1f2937;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-field:focus {
      border-color: #EAAE24;
      box-shadow: 0 0 0 3px rgba(234, 174, 36, 0.12);
      background: #ffffff;
    }
    .input-field::placeholder {
      color: #9ca3af;
      font-size: 14px;
    }
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: #042544;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: #031a30;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6b7280;
    }
    .auth-footer a {
      color: #EAAE24;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      display: none;
    }
    .error-msg.visible { display: block; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .auth-card { border-radius: 20px; }
      .auth-hero { padding: 24px 16px 22px; }
      .auth-body { padding: 20px 16px 18px; }
      .auth-hero-domain { font-size: 26px; }
      .auth-hero-logo-img { width: 64px; height: 64px; }
    }

    /* ── Store Badges & Footer ── */
    .auth-store-section {
      padding: 0 24px 24px;
      text-align: center;
    }
    .store-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 14px;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .store-divider::before,
    .store-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .store-badges {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .store-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px;
      background: #0f172a;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .store-badge:active { transform: scale(0.97); background: #1e293b; }
    .store-icon, .store-svg {
      font-size: 22px; line-height: 1;
    }
    .store-svg {
      width: 28px; height: 28px;
      display: block;
      flex-shrink: 0;
    }
    .store-text { display: flex; flex-direction: column; align-items: flex-start; }
    .store-sub { font-size: 9px; color: #94a3b8; font-weight: 500; line-height: 1.2; }
    .store-name { font-size: 13px; color: #fff; font-weight: 700; line-height: 1.3; }
    .auth-footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #9ca3af;
    }
    .auth-footer-links a {
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .auth-footer-links a:hover { color: #EAAE24; }
    .dot { color: #d1d5db; font-size: 8px; }
    @media (max-width: 480px) {
      .auth-store-section { padding: 0 16px 20px; }
      .store-badges { gap: 8px; }
      .store-badge { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-hero">
      <img src="/static/logo.png?v=3" alt="BantuDulu" class="auth-hero-logo-img" />
      <div class="auth-hero-domain">Bantudulu.com</div>
      <div class="auth-hero-tagline">Layanan jasa on-demand — langsung ke rumah Anda</div>
    </div>

    <div class="auth-body">
      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input class="input-field" type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input class="input-field" type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
          </div>
        </div>

        <button class="btn-primary" type="submit" id="submitBtn">Masuk</button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="/daftar">Daftar di sini</a>
      </div>
    </div>

    <!-- Footer with store badges -->
    <div class="auth-store-section">
      <div class="store-divider"><span>Download Aplikasi</span></div>
      <div class="store-badges">
        <a href="#" class="store-badge" target="_blank" rel="noopener">
          <img src="/static/logo-app-store.svg" alt="App Store" class="store-svg" />
          <span class="store-text">
            <span class="store-sub">Download di</span>
            <span class="store-name">App Store</span>
          </span>
        </a>
        <a href="#" class="store-badge" target="_blank" rel="noopener">
          <img src="/static/logo-googleplay.svg" alt="Google Play" class="store-svg" />
          <span class="store-text">
            <span class="store-sub">Dapatkan di</span>
            <span class="store-name">Google Play</span>
          </span>
        </a>
      </div>
      <div class="auth-footer-links">
        <a href="#">Kebijakan Privasi</a>
        <span class="dot">•</span>
        <a href="#">Syarat & Ketentuan</a>
        <span class="dot">•</span>
        <a href="#">Tentang Kami</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorMsg.textContent = 'Harap isi semua bidang.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Gagal masuk. Silakan coba lagi.';
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Masuk';
          return;
        }

        window.location.href = data.redirect || '/';

      } catch (err) {
        errorMsg.textContent = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
