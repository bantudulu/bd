<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daftar · BantuDulu</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/images/pwa/apple-touch-icon.png" />
  <meta name="theme-color" content="#28758b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BantuDulu" />
  <meta name="description" content="Layanan jasa on-demand langsung ke rumah Anda. Bersih rumah, cuci AC, les privat, pijat, salon, bantu belanja." />
  <meta name="application-name" content="BantuDulu" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#28758b;--deep:#205e70;--ink:#172126;--muted:#74838a;--white:#fff;--line:#e1e8eb}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%}
    body{
      min-height:100vh;
      font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 18% 20%,rgba(255,255,255,.16),transparent 24%),
        radial-gradient(circle at 82% 78%,rgba(255,255,255,.10),transparent 26%),
        linear-gradient(145deg,#2f8197 0%,var(--brand) 52%,#205e70 100%);
      color:var(--ink);
      overflow-x:hidden;
    }
    body:before,body:after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.055);pointer-events:none;z-index:0}
    body:before{width:280px;height:280px;top:-80px;right:-100px}
    body:after{width:220px;height:220px;bottom:-70px;left:-80px}

    .login-page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
    .login-box{width:100%;max-width:390px}
    .brand{text-align:center;color:#fff;font-size:32px;line-height:1;font-weight:800;letter-spacing:-1.2px;margin-bottom:22px;text-shadow:0 8px 28px rgba(16,59,71,.18)}
    .card{background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.56);border-radius:24px;padding:22px;box-shadow:0 22px 60px rgba(18,62,74,.20);backdrop-filter:blur(12px)}
    .card h1{margin:0 0 5px;font-size:20px;letter-spacing:-.45px}
    .card .intro{margin:0 0 20px;color:var(--muted);font-size:11px;line-height:1.5}

    .field{margin-top:13px}
    .field label{display:block;margin:0 0 7px;font-size:10px;font-weight:700;color:#46555c}
    .input-wrap{position:relative}
    .input-wrap input{
      width:100%;height:50px;border:1px solid var(--line);border-radius:15px;
      background:#fbfcfd;color:var(--ink);padding:0 43px 0 14px;outline:none;
      font-size:12px;font-family:inherit;transition:.18s;
    }
    .input-wrap input:focus{background:#fff;border-color:#a3cad4;box-shadow:0 0 0 4px rgba(40,117,139,.08)}
    .input-wrap input::placeholder{color:#9ba7ac;font-size:11px}
    .toggle{
      position:absolute;right:7px;top:50%;transform:translateY(-50%);
      width:36px;height:36px;border:0;border-radius:11px;background:transparent;
      color:#74868e;font-size:11px;font-weight:700;cursor:pointer;
    }

    .primary{
      width:100%;height:50px;border-radius:15px;font-weight:800;font-size:11.5px;
      cursor:pointer;border:0;margin-top:18px;color:#fff;
      background:linear-gradient(135deg,#2f8197,#205e70);
      box-shadow:0 10px 22px rgba(32,94,112,.22);
      transition:transform .12s;
    }
    .primary:active{transform:scale(.985)}
    .primary:disabled{opacity:.55;cursor:not-allowed}

    .signup{text-align:center;margin-top:17px;color:var(--muted);font-size:10px}
    .signup a{color:var(--deep);font-weight:700;text-decoration:none}

    .error-msg{
      background:#fef2f2;color:#dc2626;font-size:11px;font-weight:500;
      padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;
    }
    .error-msg.visible{display:block}

    /* ── Store Badges & Footer ── */
    .store-section{padding:0 2px;text-align:center;margin-top:20px}
    .store-divider{
      display:flex;align-items:center;gap:10px;margin:0 0 14px;
      font-size:9px;font-weight:600;color:rgba(255,255,255,.55);
      text-transform:uppercase;letter-spacing:.5px;
    }
    .store-divider:before,.store-divider:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.18)}
    .store-badges{display:flex;gap:10px;margin-bottom:14px}
    .store-badge{
      flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 8px;background:rgba(15,23,42,.65);border-radius:12px;
      text-decoration:none;transition:background .2s,transform .1s;
    }
    .store-badge:active{transform:scale(.97);background:rgba(30,41,59,.8)}
    .store-svg{width:22px;height:22px;display:block;flex-shrink:0}
    .store-text{display:flex;flex-direction:column;align-items:flex-start}
    .store-sub{font-size:8px;color:#94a3b8;font-weight:500;line-height:1.2}
    .store-name{font-size:11px;color:#fff;font-weight:700;line-height:1.3}
    .footer-links{
      display:flex;align-items:center;justify-content:center;gap:6px;
      font-size:10px;color:rgba(255,255,255,.45);
    }
    .footer-links a{color:rgba(255,255,255,.6);text-decoration:none;font-weight:500;transition:color .15s}
    .footer-links a:hover{color:#fff}
    .dot{color:rgba(255,255,255,.3);font-size:7px}

    @media(max-width:360px){
      .card{padding:19px}
      .brand{font-size:29px;margin-bottom:18px}
      .store-badge{padding:8px 6px}
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-box">
      <div class="brand">Bantudulu</div>
      <section class="card">
        <h1>Daftar</h1>
        <p class="intro">Buat akun Bantudulu untuk mulai memesan layanan.</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="nama">Nama Lengkap</label>
            <div class="input-wrap">
              <input type="text" id="nama" name="nama" placeholder="Nama lengkap Anda" autocomplete="name" required>
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label for="no_hp">Nomor HP</label>
            <div class="input-wrap">
              <input type="tel" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" autocomplete="tel" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="Min. 6 karakter" autocomplete="new-password" required>
              <button class="toggle" id="togglePass" type="button">Lihat</button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Konfirmasi Password</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi password" autocomplete="new-password" required>
              <button class="toggle" id="toggleConfirm" type="button">Lihat</button>
            </div>
          </div>

          <button class="primary" type="submit" id="submitBtn">Daftar</button>
        </form>

        <div class="signup">Sudah punya akun? <a href="/masuk">Masuk</a></div>
      </section>

      <div class="store-section">
        <div class="store-divider"><span>Download Aplikasi</span></div>
        <div class="store-badges">
          <a href="#" class="store-badge" target="_blank" rel="noopener">
            <img src="/static/logo-app-store.svg" alt="App Store" class="store-svg" />
            <span class="store-text">
              <span class="store-sub">Download di</span>
              <span class="store-name">App Store</span>
            </span>
          </a>
          <a href="#" class="store-badge" target="_blank" rel="noopener">
            <img src="/static/logo-googleplay.svg" alt="Google Play" class="store-svg" />
            <span class="store-text">
              <span class="store-sub">Dapatkan di</span>
              <span class="store-name">Google Play</span>
            </span>
          </a>
        </div>
        <div class="footer-links">
          <a href="#">Kebijakan Privasi</a>
          <span class="dot">•</span>
          <a href="#">Syarat & Ketentuan</a>
          <span class="dot">•</span>
          <a href="#">Tentang Kami</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Password toggle helper
    function bindToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);
      button.addEventListener('click', () => {
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        button.textContent = hidden ? 'Tutup' : 'Lihat';
      });
    }
    bindToggle('password', 'togglePass');
    bindToggle('confirmPassword', 'toggleConfirm');

    // Register form submission
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();
      const no_hp = document.getElementById('no_hp').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!nama || !email || !no_hp || !password) {
        errorMsg.textContent = 'Harap isi semua bidang.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Kata sandi minimal 6 karakter.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Konfirmasi password tidak cocok.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, email, no_hp, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Gagal mendaftar. Silakan coba lagi.';
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Daftar';
          return;
        }

        window.location.href = data.redirect || '/beranda';

      } catch (err) {
        errorMsg.textContent = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
