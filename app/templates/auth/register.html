<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daftar · BantuDulu</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/images/pwa/apple-touch-icon.png" />
  <meta name="theme-color" content="#042544" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BantuDulu" />
  <meta name="description" content="Layanan jasa on-demand langsung ke rumah Anda. Bersih rumah, cuci AC, les privat, pijat, salon, bantu belanja." />
  <meta name="application-name" content="BantuDulu" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #e0f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(13, 148, 136, 0.10);
      overflow: hidden;
    }
    .auth-hero {
      background: linear-gradient(135deg, #042544 0%, #063a6e 50%, #0a5098 100%);
      padding: 16px 20px 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .auth-hero-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-hero-logo-icon {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 16px;
    }
    .auth-hero-logo-text {
      font-size: 20px; font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .auth-hero-image {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .auth-hero-tagline {
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      font-weight: 500;
      padding: 4px 0 12px;
      letter-spacing: 0.2px;
    }
    .auth-body {
      padding: 24px 24px 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #9ca3af;
      font-size: 18px;
      pointer-events: none;
      line-height: 1;
    }
    .input-field {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1f2937;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-field:focus {
      border-color: #EAAE24;
      box-shadow: 0 0 0 3px rgba(234, 174, 36, 0.12);
      background: #ffffff;
    }
    .input-field::placeholder {
      color: #9ca3af;
      font-size: 14px;
    }
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: #042544;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: #031a30;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6b7280;
    }
    .auth-footer a {
      color: #EAAE24;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      display: none;
    }
    .error-msg.visible { display: block; }
    @media (max-width: 480px) {
      body { padding: 12px; }
      .auth-card { border-radius: 20px; }
      .auth-hero { padding: 14px 16px 0; }
      .auth-body { padding: 20px 16px 18px; }
    }

    /* ── Store Badges & Footer ── */
    .auth-store-section {
      padding: 0 24px 24px;
      text-align: center;
    }
    .store-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 14px;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .store-divider::before,
    .store-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .store-badges {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .store-badge {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 8px;
      background: #0f172a;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .store-badge:active { transform: scale(0.97); background: #1e293b; }
    .store-icon { font-size: 22px; line-height: 1; }
    .store-text { display: flex; flex-direction: column; align-items: flex-start; }
    .store-sub { font-size: 9px; color: #94a3b8; font-weight: 500; line-height: 1.2; }
    .store-name { font-size: 13px; color: #fff; font-weight: 700; line-height: 1.3; }
    .auth-footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #9ca3af;
    }
    .auth-footer-links a {
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .auth-footer-links a:hover { color: #EAAE24; }
    .dot { color: #d1d5db; font-size: 8px; }
    @media (max-width: 480px) {
      .auth-store-section { padding: 0 16px 20px; }
      .store-badges { gap: 8px; }
      .store-badge { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-hero">
      <div class="auth-hero-top">
        <div class="auth-hero-logo">
          <span class="auth-hero-logo-icon">🤝</span>
          <span class="auth-hero-logo-text">BantuDulu</span>
        </div>
        <a href="/masuk" style="color:rgba(255,255,255,0.85);font-size:13px;font-weight:600;text-decoration:none;">Masuk</a>
      </div>
      <img src="/static/images/hero-ilustrasi.svg" alt="BantuDulu Hero" class="auth-hero-image" />
      <div class="auth-hero-tagline">Layanan jasa on-demand — langsung ke rumah Anda ✨</div>
    </div>

    <div class="auth-body">
      <div class="error-msg" id="errorMsg"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="nama">Nama</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input class="input-field" type="text" id="nama" name="nama" placeholder="Nama lengkap" autocomplete="name" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input class="input-field" type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="no_hp">No. HP</label>
          <div class="input-wrapper">
            <span class="input-icon">📱</span>
            <input class="input-field" type="tel" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" autocomplete="tel" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Kata Sandi</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input class="input-field" type="password" id="password" name="password" placeholder="Min. 6 karakter" autocomplete="new-password" required>
          </div>
        </div>

        <button class="btn-primary" type="submit" id="submitBtn">Daftar</button>
      </form>

      <div class="auth-footer">
        Sudah punya akun? <a href="/masuk">Masuk di sini</a>
      </div>
    </div>

    <!-- Footer with store badges -->
    <div class="auth-store-section">
      <div class="store-divider"><span>Download Aplikasi</span></div>
      <div class="store-badges">
        <a href="#" class="store-badge" target="_blank" rel="noopener">
          <span class="store-icon">🍎</span>
          <span class="store-text">
            <span class="store-sub">Download di</span>
            <span class="store-name">App Store</span>
          </span>
        </a>
        <a href="#" class="store-badge" target="_blank" rel="noopener">
          <span class="store-icon">▶️</span>
          <span class="store-text">
            <span class="store-sub">Dapatkan di</span>
            <span class="store-name">Google Play</span>
          </span>
        </a>
      </div>
      <div class="auth-footer-links">
        <a href="#">Kebijakan Privasi</a>
        <span class="dot">•</span>
        <a href="#">Syarat & Ketentuan</a>
        <span class="dot">•</span>
        <a href="#">Tentang Kami</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();
      const no_hp = document.getElementById('no_hp').value.trim();
      const password = document.getElementById('password').value;

      if (!nama || !email || !no_hp || !password) {
        errorMsg.textContent = 'Harap isi semua bidang.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Kata sandi minimal 6 karakter.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, email, no_hp, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Gagal mendaftar. Silakan coba lagi.';
          errorMsg.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Daftar';
          return;
        }

        window.location.href = data.redirect || '/beranda';

      } catch (err) {
        errorMsg.textContent = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
        errorMsg.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }
  </script>
</body>
</html>
